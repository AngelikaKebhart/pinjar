# Dependabot keeps the dependency updates coming as pull requests. The security
# side of it (alerts and automatic security updates) is switched on in the
# repository settings, not here — this file only governs the routine updates.
#
# Grouping rule throughout: minor and patch updates travel together, majors
# always arrive on their own. A grouped pull request that goes red does not say
# which of its updates broke the build, and that is precisely the question a
# major raises. One major per pull request keeps the answer obvious.
version: 2

updates:
  # "npm" is the ecosystem name for the whole JavaScript world; Dependabot reads
  # the pnpm lockfile fine. Nothing in here ships to users: React and the WXT
  # toolchain are bundled at build time, the rest is tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Room for the grouped pull request plus a handful of separate majors in a
    # week where several land at once. The default of 5 is too tight for that.
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore
    # Two groups rather than one, so an update that can break the extension is
    # never bundled with one that can only break the build.
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The workflow pins actions by major tag (actions/checkout@v7), so a new major
  # is the one thing that needs a deliberate look — and gets its own pull
  # request for it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
