<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      WXT turns this into the toolbar tooltip (action.default_title). It is the
      product name, which is identical in German and English, so it is not
      routed through the message catalogs. Any other user-facing text belongs
      in src/i18n, never in this file.
    -->
    <title>Universal Wishlist</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
